name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests, attack-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dev stack (postgres, openldap, clickhouse)
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300 \
            postgres openldap clickhouse

      - name: Go test and build (Dockerfile.ci target test)
        run: docker build -f deploy/docker/Dockerfile.ci --target test .

      - name: attack-and-tests (Dockerfile.ci target integration, host network)
        run: docker build -f deploy/docker/Dockerfile.ci --target integration -t oktopus-ci:integration . && docker run --rm --network host oktopus-ci:integration

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build (Dockerfile.web)
        run: docker build -f deploy/docker/Dockerfile.web --target build .

  bump-web-version:
    name: Bump web version
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    concurrency:
      group: bump-web-version-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump patch (dev) or minor (main)
        id: bump
        env:
          BUMP_KIND: ${{ github.ref == 'refs/heads/main' && 'minor' || 'patch' }}
        run: |
          NEW_VERSION=$(node scripts/bump-web-version.mjs "$BUMP_KIND")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(version): bump web to ${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
