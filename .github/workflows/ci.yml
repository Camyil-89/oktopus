name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests, attack-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dev stack (postgres, openldap, clickhouse)
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300 \
            postgres openldap clickhouse

      - name: Go test and build (Dockerfile.ci target test)
        run: docker build -f deploy/docker/Dockerfile.ci --target test .

      - name: attack-and-tests (Dockerfile.ci target integration, host network)
        run: docker build -f deploy/docker/Dockerfile.ci --target integration -t oktopus-ci:integration . && docker run --rm --network host oktopus-ci:integration

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build (Dockerfile.web)
        run: docker build -f deploy/docker/Dockerfile.web --target build .

      - name: Build static UI (Dockerfile.nginx export)
        run: docker build -f deploy/docker/Dockerfile.nginx --build-arg NEXT_PUBLIC_API_URL= .

  bump-web-version:
    name: Bump web version
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    concurrency:
      group: bump-web-version-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump patch (dev) or minor (main)
        id: bump
        env:
          BUMP_KIND: ${{ github.ref == 'refs/heads/main' && 'minor' || 'patch' }}
        run: |
          NEW_VERSION=$(node scripts/bump-web-version.mjs "$BUMP_KIND")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(version): bump web to ${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  release:
    name: Publish images and GitHub Release
    runs-on: ubuntu-latest
    needs: [backend, frontend, bump-web-version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version bump
        env:
          BRANCH: ${{ github.ref_name }}
        run: git fetch origin "$BRANCH" && git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Read product version
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./web/package.json').version")
          suffix=""
          if [[ "$BRANCH" == dev ]]; then
            version="${version}-dev"
            suffix=/dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "oktopus=ghcr.io/camyil-89/oktopus/oktopus${suffix}" >> "$GITHUB_OUTPUT"
          echo "nginx=ghcr.io/camyil-89/oktopus/nginx${suffix}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build oktopus image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.oktopus
          push: false
          load: true
          tags: |
            ${{ steps.ver.outputs.oktopus }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.oktopus }}:latest

      - name: Build nginx image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.nginx
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ steps.ver.outputs.nginx }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.nginx }}:latest

      - name: Push container images
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OKTOPUS: ${{ steps.ver.outputs.oktopus }}
          NGINX: ${{ steps.ver.outputs.nginx }}
        run: |
          set -euo pipefail
          for ref in "$OKTOPUS:$VERSION" "$OKTOPUS:latest" "$NGINX:$VERSION" "$NGINX:latest"; do
            docker push "$ref"
          done

      - name: Deploy bundle for release
        run: |
          chmod +x scripts/ci-release-bundle.sh
          scripts/ci-release-bundle.sh "${{ steps.ver.outputs.version }}"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          options=()
          if [[ "$VERSION" == *-dev ]]; then options+=(--prerelease); fi
          gh release create "$TAG" \
            "${options[@]}" \
            --title "Oktopus $TAG" \
            --generate-notes \
            "dist/oktopus-${VERSION}-deploy.tar.gz"
