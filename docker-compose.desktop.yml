# Docker Desktop (Windows/macOS): oktopus в bridge-сети, nginx → oktopus:API_PORT.
# Прокси на хосте здесь не тестируется — для прода используй docker-compose.yml на Linux.
# Запуск: scripts/stack-up.bat (выбирает этот файл автоматически).

name: oktopus-onprem

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - oktopus_onprem_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT}:9000"
    volumes:
      - oktopus_onprem_ch:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  oktopus:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.oktopus
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      OKTOPUS_API_LISTEN: 0.0.0.0:${OKTOPUS_API_INTERNAL_PORT:-18002}
      OKTOPUS_CORS_ORIGINS: ${OKTOPUS_CORS_ORIGINS}
      OKTOPUS_ADMIN_USERNAME: ${OKTOPUS_ADMIN_USERNAME}
      OKTOPUS_ADMIN_PASSWORD: ${OKTOPUS_ADMIN_PASSWORD}
    volumes:
      - oktopus_onprem_config:/app/config

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nginx
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      OKTOPUS_API_UPSTREAM_HOST: ${OKTOPUS_API_UPSTREAM_HOST:-oktopus}
      OKTOPUS_API_INTERNAL_PORT: ${OKTOPUS_API_INTERNAL_PORT:-18002}
    depends_on:
      oktopus:
        condition: service_started
    ports:
      - "${OKTOPUS_API_PORT}:8000"

volumes:
  oktopus_onprem_pg:
  oktopus_onprem_ch:
  oktopus_onprem_config:
