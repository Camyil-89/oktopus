# Локальный стек для Portainer / Linux (host network только у oktopus — HTTP-прокси).
#
# Развёртывание в Portainer: Stacks → Add stack → Web editor → вставить compose
# или указать путь к репозиторию; build context — корень репозитория.
#
# Запуск с хоста:
#   docker compose -f docker-compose.local.yml up --build -d
#
# UI:     http://12.0.0.9:15001/      (только nginx снаружи)
# API:    только через nginx: /api/... (прямой :15002 — localhost хоста)
# Прокси: порт из настроек в кабинете (на хосте, напр. 0.0.0.0:8188)
# Admin:  admin / admin
#
# LDAP на хосте: ldap://127.0.0.1:1389 (oktopus в сети хоста)
#
# На Windows Docker Desktop host network не поддерживается — деплой на Linux/Portainer.

name: oktopus-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oktopus
      POSTGRES_PASSWORD: oktopus
      POSTGRES_DB: oktopus
    volumes:
      - oktopus_local_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oktopus -d oktopus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  oktopus:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.oktopus
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://oktopus:oktopus@127.0.0.1:5432/oktopus?sslmode=disable
      # 0.0.0.0 — чтобы nginx в bridge достучался до API через host.docker.internal
      OKTOPUS_API_LISTEN: 0.0.0.0:15002
      OKTOPUS_JWT_SECRET: local-docker-jwt-secret
      OKTOPUS_CORS_ORIGINS: http://12.0.0.9:15001
      OKTOPUS_ADMIN_USERNAME: admin
      OKTOPUS_ADMIN_PASSWORD: admin
    volumes:
      - oktopus_local_config:/app/config

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        # Относительные URL — браузер ходит на тот же origin (nginx), /api/* проксируется
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      oktopus:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nginx
    depends_on:
      - web
    ports:
      - "15001:15001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  oktopus_local_pg:
  oktopus_local_config:
