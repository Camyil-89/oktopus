# ============================================
# Squid configuration for Docker
# ============================================

# --- Сетевые настройки ---
# Порт для обычного HTTP-прокси
http_port 3128

# Порт для SSL Bump (раскомментируйте, если нужна инспекция HTTPS)
# http_port 3129 ssl-bump \
#   cert=/etc/squid/ssl/squid-ca-cert.pem \
#   key=/etc/squid/ssl/squid-ca-key.pem \
#   generate-host-certificates=on \
#   dynamic_cert_mem_cache_size=4MB

# --- ACL: Локальные сети ---
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# --- ACL: Безопасные порты ---
acl SSL_ports port 443
acl Safe_ports port 80          # HTTP
acl Safe_ports port 443         # HTTPS
acl Safe_ports port 21          # FTP
acl Safe_ports port 1025-65535  # Зарегистрированные порты

# --- Правила доступа ---
# Запрещаем доступ к небезопасным портам
http_access deny !Safe_ports

# Запрещаем CONNECT ко всем портам, кроме SSL_ports
http_access deny CONNECT !SSL_ports

# Разрешаем доступ из локальных сетей
http_access allow localnet
http_access allow localhost

# Запрещаем всё остальное
http_access deny all

# --- Настройки кэширования ---
cache_mem 256 MB
maximum_object_size_in_memory 4 MB
cache_dir ufs /var/spool/squid 1000 16 256
maximum_object_size 100 MB

# --- Логирование ---
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# --- DNS ---
dns_nameservers 8.8.8.8 8.8.4.4

# --- Скрытие информации о версии ---
httpd_suppress_version_string on
via off
forwarded_for delete

# --- SSL Bump правила (раскомментируйте при использовании) ---
# ssl_bump server-first all
# sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
# sslcrtd_children 5